name: Mac native candidates
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Native runtime qualification or full unsigned package
        type: choice
        options: [runtime, package]
        default: runtime
permissions:
  contents: read
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.0
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - name: Download exact vendor runtime and matching source
        run: |
          mkdir -p .build-cache
          curl --fail --location --retry 3 --proto '=https' --output .build-cache/bambu.dmg 'https://github.com/bambulab/BambuStudio/releases/download/v02.08.02.61/Bambu_Studio_mac-v02.08.02.61-20260820225108.dmg'
          curl --fail --location --retry 3 --proto '=https' --output .build-cache/bambu-source.tar.gz 'https://codeload.github.com/bambulab/BambuStudio/tar.gz/refs/tags/v02.08.02.61'
      - name: Verify native runtime and complete profiles
        if: inputs.stage == 'runtime'
        run: node --import tsx scripts/macos/prepare-bambu.ts '${{ matrix.arch }}' .build-cache/bambu.dmg .build-cache/bambu-source.tar.gz
      - name: Build unsigned native QA package
        if: inputs.stage == 'package'
        run: npm run dist:mac -- --arch '${{ matrix.arch }}' --bambu-dmg .build-cache/bambu.dmg --bambu-source .build-cache/bambu-source.tar.gz --unsigned-local
      - name: Native app install and isolated save/reopen
        if: inputs.stage == 'package'
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          node scripts/macos/verify-installer.mjs --arch '${{ matrix.arch }}' --dmg "release/mac-${{ matrix.arch }}/Catalyst-Foundry-$version-mac-${{ matrix.arch }}.dmg" --evidence "$RUNNER_TEMP/foundry-native" --unsigned-local
      - name: Native offline X1/X2D fixture slices
        env:
          FOUNDRY_QA_RUNTIME: ${{ github.workspace }}/vendor/bambu-macos-${{ matrix.arch }}
          FOUNDRY_QA_WORK: ${{ runner.temp }}/foundry-slices
        run: node --import tsx scripts/windows/verify-review-connect.ts "$RUNNER_TEMP/foundry-slice-evidence"
      - name: Retain native test candidates only
        if: inputs.stage == 'package'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac-unsigned-qa-${{ matrix.arch }}
          path: |
            release/mac-${{ matrix.arch }}/*.dmg
            release/mac-${{ matrix.arch }}/*.zip
            release/mac-${{ matrix.arch }}/package-build.json
